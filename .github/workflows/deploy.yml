name: Frontend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS files
        run: |
          git lfs pull
          git lfs checkout

      - name: Verify PDF
        run: |
          ls -lh public/RegiusLab_Creds.pdf
          file public/RegiusLab_Creds.pdf
          sha256sum public/RegiusLab_Creds.pdf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache: false

      - name: Test lead API
        working-directory: api
        run: go test ./...

  deploy:
    name: Deploy frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS files
        run: |
          git lfs pull
          git lfs checkout

      - name: Verify PDF before Docker build
        run: |
          echo "=== PDF before docker build ==="
          ls -lh public/RegiusLab_Creds.pdf
          file public/RegiusLab_Creds.pdf
          sha256sum public/RegiusLab_Creds.pdf

          test "$(stat -c '%s' public/RegiusLab_Creds.pdf)" = "3038806"

      - name: Build and start container
        env:
          BITRIX24_WEBHOOK_URL: ${{ secrets.BITRIX24_WEBHOOK_URL }}
        run: docker compose up --build --detach --wait --remove-orphans
